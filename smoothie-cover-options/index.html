<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick a Cover — The 5-Minute Smoothie Recipe Book</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f6f1fa;
    color: #2b0a5e;
    text-align: center;
  }
  header {
    background: #5e2b97;
    color: #fff;
    padding: 28px 16px 24px;
  }
  header h1 { font-size: 1.55rem; line-height: 1.25; font-weight: bold; }
  header p { margin-top: 8px; font-size: 1rem; opacity: 0.9; }
  main { max-width: 560px; margin: 0 auto; padding: 8px 14px 40px; }
  section { margin-top: 30px; }
  h2 {
    font-size: 1.3rem;
    color: #4a0e8f;
    margin-bottom: 12px;
  }
  img.cover {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(43, 10, 94, 0.25);
  }
  footer { padding: 0 16px 34px; font-size: 0.95rem; color: #5e2b97; }
</style>
</head>
<body>
  <header>
    <h1>Pick a cover — The 5-Minute Smoothie Recipe Book</h1>
    <p>Scroll down to see all three options.</p>
  </header>
  <main>
    <section>
      <h2>Option 1 — Lemons</h2>
      <img class="cover" src="cover-lemons.jpg" alt="Cover option 1: Juliet holding a bowl of lemons">
    </section>
    <section>
      <h2>Option 2 — Holding the Smoothie</h2>
      <img class="cover" src="cover-smoothie.jpg" alt="Cover option 2: Juliet holding a purple smoothie">
    </section>
    <section>
      <h2>Option 3 — Sitting Down</h2>
      <img class="cover" src="cover-seated-v2.jpg" alt="Cover option 3: Juliet sitting in a chair">
    </section>
  </main>
  <footer>Just tell Leroy the option number you like best.</footer>
</body>
</html>

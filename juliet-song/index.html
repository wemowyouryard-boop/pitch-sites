<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juliet the Smoothie Queen — Songs</title>
<style>
  body { font-family: Georgia, serif; background: #1a1033; color: #f5eefc; margin: 0; padding: 32px 20px; text-align: center; }
  h1 { font-size: 27px; margin: 8px 0 4px; color: #ffd166; }
  p.sub { color: #cbb8ee; margin: 0 0 26px; font-style: italic; }
  .card { background: #26154d; border-radius: 16px; padding: 22px 18px; max-width: 480px; margin: 0 auto 20px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .card h2 { font-size: 20px; margin: 0 0 4px; color: #ffd166; }
  .card p.len { color: #cbb8ee; margin: 0 0 14px; font-size: 14px; }
  audio { width: 100%; margin: 4px 0 18px; }
  a.btn { display: block; background: #ffd166; color: #1a1033; font-weight: bold; font-size: 19px; padding: 16px; border-radius: 12px; text-decoration: none; }
  a.btn:active { background: #f0bd45; }
</style>
</head>
<body>
  <h1>🎵 Juliet the Smoothie Queen</h1>
  <p class="sub">All the versions — tap Download under the one you want</p>

  <div class="card">
    <h2>First EDM Version</h2>
    <p class="len">The first EDM song — 50 seconds</p>
    <audio controls preload="metadata" src="edm-first.mp3"></audio>
    <a class="btn" href="edm-first.mp3" download="Juliet-the-Smoothie-Queen-EDM.mp3">⬇ Download</a>
  </div>

  <div class="card">
    <h2>Runway EDM Version</h2>
    <p class="len">2 minutes 44 seconds</p>
    <audio controls preload="metadata" src="runway-edm.mp3"></audio>
    <a class="btn" href="runway-edm.mp3" download="Juliet-the-Smoothie-Queen-Runway.mp3">⬇ Download</a>
  </div>

  <div class="card">
    <h2>Long Version</h2>
    <p class="len">4 minutes — long drawn-out notes</p>
    <audio controls preload="metadata" src="long-version.mp3"></audio>
    <a class="btn" href="long-version.mp3" download="Juliet-the-Smoothie-Queen-Long.mp3">⬇ Download</a>
  </div>
</body>
</html>
